name: Plugin

# Builds the companion plugin and publishes it to the rolling "plugin-latest"
# release, so servers can always fetch it from the same URL:
#   https://github.com/<owner>/<repo>/releases/download/plugin-latest/matrix-minecraft-bridge.jar

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin
        run: mvn -B -f plugin/pom.xml package

      - uses: actions/upload-artifact@v5
        with:
          name: matrix-minecraft-bridge
          path: plugin/target/matrix-minecraft-bridge.jar

      - name: Publish to plugin-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=plugin/target/matrix-minecraft-bridge.jar
          git tag -f plugin-latest
          git push -f origin plugin-latest
          if gh release view plugin-latest >/dev/null 2>&1; then
            gh release upload plugin-latest "$JAR" --clobber
          else
            gh release create plugin-latest "$JAR" \
              --title "Companion plugin (latest)" \
              --notes "Latest build of the matrix-minecraft companion plugin from main. Add this URL to PLUGINS on your itzg/minecraft-server container: https://github.com/${{ github.repository }}/releases/download/plugin-latest/matrix-minecraft-bridge.jar" \
              --latest=false
          fi
